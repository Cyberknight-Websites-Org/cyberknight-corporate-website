---
layout: default
---

<article class="page-content documentation docs-index">
  <div class="container">
    <header class="page-header">
      <h1>{{ page.title }}</h1>
    </header>

    <div class="doc-layout">
      <div class="doc-body docs-index-body">
        {{ content }}
      </div>

      <aside class="doc-toc">
        <div class="doc-toc-inner">
          <p class="doc-toc-title">On This Page</p>
          <nav id="doc-toc-nav"></nav>
        </div>
      </aside>
    </div>
  </div>
</article>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var body = document.querySelector('.docs-index-body');
    var nav = document.getElementById('doc-toc-nav');
    if (!body || !nav) return;

    var headings = body.querySelectorAll('h2');
    if (headings.length === 0) return;

    var ul = document.createElement('ul');

    headings.forEach(function(heading) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = '#' + heading.id;
      a.textContent = heading.textContent;
      li.appendChild(a);
      ul.appendChild(li);
    });

    nav.appendChild(ul);
  });
</script>
