# Site settings
title: Cyberknight Websites
email: JulianLopez@cyberknight-websites.com
description: >-
  Modern web solutions for Knights of Columbus councils.
  The pen is mightier than the sword, but modern knights require both modern swords and modern pens.
baseurl: ""
url: "https://cyberknight-websites.com"

# Build settings
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

# Collections
collections:
  documentation:
    output: true
    permalink: /docs/:path/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - README.md
  - .claude/
  - CLAUDE.md
  - deploy.sh
  - build_www.sh
  - server_build_script.sh
  - jekyll_serve_dev.sh
  - doc-skill-update.md
  - logs/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "documentation"
    values:
      layout: "doc"
